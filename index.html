<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineBook - Create an Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <section class="visual-panel">
      <div class="brand">
        <span>Cine<span>Book</span></span>
      </div>

      <div class="welcome-copy">
        <p class="eyebrow">WELCOME TO CINEBOOK</p>
        <h1>Every great story<br>starts with a ticket.</h1>
        <p class="intro">Discover films, choose your favourite seat, and enjoy the show.</p>
      </div>
    </section>

    <section class="form-panel">
      <div class="form-content">
        <p class="form-kicker">CREATE AN ACCOUNT</p>
        <h2>Join CineBook</h2>
        <p class="subtitle">Your next cinema experience is just a minute away.</p>

        <form id="myForm" novalidate>
          <div class="form-group">
            <label for="name">Full name</label>
            <input type="text" id="name" placeholder="Your full name">
            <span class="error" id="nameError"></span>
          </div>

          <div class="form-group">
            <label for="email">Email address</label>
            <input type="text" id="email" placeholder="you@example.com">
            <span class="error" id="emailError"></span>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">
            <span class="error" id="passwordError"></span>
          </div>

          <div class="form-group">
            <label>Gender</label>
            <div class="options">
              <label><input type="radio" name="gender" value="Male"> Male</label>
              <label><input type="radio" name="gender" value="Female"> Female</label>
              <label><input type="radio" name="gender" value="Other"> Other</label>
            </div>
            <span class="error" id="genderError"></span>
          </div>

          <button type="submit">Create account <span aria-hidden="true">→</span></button>
        </form>

        <p class="login-note">Already have an account? <span>Log in</span></p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
